<svg width="130" height="130" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="avatarGradient" x1="10" y1="10" x2="120" y2="120">

            <stop offset="0%" stop-color="#7657FF"></stop>
            <stop offset="50%" stop-color="#A855F7"></stop>
            <stop offset="100%" stop-color="#4F46E5"></stop>

        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>

    <circle cx="65" cy="65" r="53" fill="none" stroke="#7657FF" stroke-width="1" opacity="0.25"></circle>

    <circle cx="65" cy="65" r="45" fill="none" stroke="url(#avatarGradient)" stroke-width="2" filter="url(#glow)"></circle>

    <circle cx="65" cy="65" r="36" fill="rgba(118,87,255,0.12)" stroke="#7657FF" stroke-width="2"></circle>

    <circle cx="65" cy="12" r="2" fill="#7657FF"></circle>
    <circle cx="65" cy="118" r="2" fill="#7657FF"></circle>
    <circle cx="12" cy="65" r="2" fill="#7657FF"></circle>
    <circle cx="118" cy="65" r="2" fill="#7657FF"></circle>

</svg>